name: Build and test
on:
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
  TEST_RESULTS: artifacts/tests
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build solution
      run: dotnet build
    - name: Run core tests
      run: dotnet test --no-build --verbosity normal -- --results-directory '${{ env.TEST_RESULTS }}' --report-xunit-trx --filter-query '/*/*/(!*NatsL1*)&(!*RedisL1*)'
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action/linux@v2
      if: ${{ success() || failure() }}
      with:
        files: '${{ env.TEST_RESULTS }}/*.trx'
        check_name: "Core Test results"
        report_individual_runs: true
        action_fail: true
        time_unit: milliseconds
        #ignore_runs: true
        compare_to_earlier_commit: false
    - name: Upload core test reports
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: core-test-reports
        path: '${{ env.TEST_RESULTS }}/*.trx'
        if-no-files-found: warn

  test-backplanes:
    name: ${{ matrix.name }} L1 tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nats
            filter: '/*/*/*NatsL1*'
          - name: Redis
            filter: '/*/*/*RedisL1*'
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@master
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build solution
      run: dotnet build
    - name: Run ${{ matrix.name }}L1 tests
      run: dotnet test --no-build --verbosity normal -- --results-directory '${{ env.TEST_RESULTS }}' --report-xunit-trx --filter-query '${{ matrix.filter }}'
    - name: Publish ${{ matrix.name }} test results
      uses: EnricoMi/publish-unit-test-result-action/linux@v2
      if: ${{ success() || failure() }}
      with:
        files: '${{ env.TEST_RESULTS }}/*.trx'
        check_name: "${{ matrix.name }} Test results"
        report_individual_runs: true
        action_fail: true
        time_unit: milliseconds
        compare_to_earlier_commit: false
    - name: Upload ${{ matrix.name }} test reports
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: ${{ matrix.name }}-test-reports
        path: '${{ env.TEST_RESULTS }}/*.trx'
        if-no-files-found: warn
